name: Refresh TataTV IPTV

on:
  schedule:
    - cron: "0 */6 * * *"      # প্রতি ৬ ঘণ্টায়
  workflow_dispatch:            # ম্যানুয়াল রান
  push:
    branches: [main]
    paths:
      - "generate.py"
      - "config.json"
      - ".github/workflows/*.yml"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate playlists
        env:
          # config.json এ সেট না থাকলে এই env দিয়ে fallback করবে
          PORTAL_URL:  ${{ vars.PORTAL_URL  }}
          MAC_ADDR:    ${{ vars.MAC_ADDR    }}
          SOCKS_PROXY: ${{ secrets.SOCKS_PROXY }}
        run: |
          python generate.py

      - name: Deploy to GitHub Pages (optional)
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playlists
          destination_dir: playlists
          keep_files: true

      - name: Commit playlists/ & m3u/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/ m3u/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh playlists $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
